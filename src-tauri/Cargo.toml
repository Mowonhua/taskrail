[package]
name = "taskrail"
version = "0.8.8"
description = "Markdown task editor"
license = "MIT"
edition = "2021"
default-run = "taskrail"

[[bin]]
name = "taskrail-server"
path = "src/bin/taskrail-server.rs"

[lib]
name = "taskrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
tauri-plugin-process = "2.4.0"
fontdb = "0.24.0"
tauri-plugin-fs = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-taskrail-mobile = { path = "plugins/mobile" }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = "2.13.1"
base64 = "0.22"
minisign-verify = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time", "net", "rt-multi-thread", "macros", "signal", "sync"] }
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
subtle = "2"
unicode-segmentation = "1"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6.0"
windows-version = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
